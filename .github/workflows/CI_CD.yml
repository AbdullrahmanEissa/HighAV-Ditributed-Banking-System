name: Build and Deploy High Availability Stack

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/banking-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/banking-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - name: Deploy to Primary EC2
        run: |
          docker compose -f docker-compose-primary.yml pull backend frontend
          docker compose -f docker-compose-primary.yml up -d

      - name: Deploy to Standby EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STANDBY_EC2_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY_STANDBY }}
          script: |
            docker compose -f docker-compose-standby.yml pull backend frontend
            docker compose -f docker-compose-standby.yml up -d
