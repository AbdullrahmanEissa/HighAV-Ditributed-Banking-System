name: Build and Deploy High Availability Stack

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/banking-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/banking-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ${{ matrix.node_label }} 
    strategy:
      matrix:
        include:
          - node_label: primary
            compose_file: docker-compose-primary.yml
          - node_label: standby
            compose_file: docker-compose-standby.yml
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Docker Compose
        run: |
          docker compose -f ${{ matrix.compose_file }} pull backend frontend
          docker compose -f ${{ matrix.compose_file }} up -d

