name: Build and Deploy High Availability Stack

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: abdueissa/banking-backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: abdueissa/banking-frontend:latest

      - name: Build and Push Postgres Patroni
        uses: docker/build-push-action@v5
        with:
          context: ./postgres-patroni
          push: true
          tags: abdueissa/banking-postgres-patroni:latest

  deploy:
    needs: build-and-push
    strategy:
      matrix:
        include:
          - role: primary
            compose_file: docker-compose-primary.yml
          - role: standby
            compose_file: docker-compose-standby.yml
    runs-on: [self-hosted, linux, x64, "${{ matrix.role }}"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Pull Latest Images and Deploy
        run: |
          docker compose -f ${{ matrix.compose_file }} pull
          docker compose -f ${{ matrix.compose_file }} up -d --remove-orphans
