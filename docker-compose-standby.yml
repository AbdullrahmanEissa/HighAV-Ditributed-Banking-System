services:
  db:
    image: abdueissa/banking-postgres-patroni:latest
    container_name: standby_db
    hostname: patroni-standby
    restart: always
    ports:
      - "5432:5432"
      - "8008:8008"
    volumes:
      - pg_standby_patroni_data:/var/lib/postgresql/data
    environment:
      PATRONI_SCOPE: banking-cluster
      PATRONI_NAME: patroni-standby
      PATRONI_IP: 172.31.38.189
      ETCD_HOSTS: 172.31.38.111:2379
      DB_PASS: dbprimarybanking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: standby_redis
    restart: always

  backend:
    image: abdueissa/banking-backend:latest
    container_name: standby_backend
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: banking
      DB_USER: postgres
      DB_PASS: dbprimarybanking
      REDIS_HOST: redis
      NODE_ROLE: STANDBY-EC2-2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: abdueissa/banking-frontend:latest
    container_name: standby_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pg_standby_patroni_data:
