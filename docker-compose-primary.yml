services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: primary_etcd
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    command:
      - /usr/local/bin/etcd
      - --name=etcd-primary
      - --listen-client-urls=http://0.0.0
      - --advertise-client-urls=http://172.31.38.111:2379
      - --listen-peer-urls=http://0.0.0
      - --initial-advertise-peer-urls=http://172.31.38.111:2380
      - --initial-cluster=etcd-primary=http://172.31.38.111:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=banking-ha-cluster
      - --enable-v2=true

  db:
    image: abdueissa/banking-postgres-patroni:latest
    container_name: primary_db
    hostname: patroni-primary
    restart: always
    depends_on:
      - etcd
    ports:
      - "5432:5432"
      - "8008:8008"
    volumes:
      - pg_primary_patroni_data:/var/lib/postgresql/data
    environment:
      PATRONI_SCOPE: banking-cluster
      PATRONI_NAME: patroni-primary
      PATRONI_IP: 172.31.38.111
      ETCD_HOSTS: 172.31.38.111:2379
      DB_PASS: dbprimarybanking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: primary_redis
    restart: always

  backend:
    image: abdueissa/banking-backend:latest
    container_name: primary_backend
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: banking
      DB_USER: postgres
      DB_PASS: dbprimarybanking
      REDIS_HOST: redis
      NODE_ROLE: PRIMARY-EC2-1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: abdueissa/banking-frontend:latest
    container_name: primary_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pg_primary_patroni_data:
