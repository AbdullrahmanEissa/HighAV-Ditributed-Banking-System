services:
  db:
    image: postgres:16-alpine
    container_name: primary_db
    restart: always
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dbprimarybanking
    ports:
      - "5432:5432"
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: primary_redis
    restart: always

  backend:
    image: abdueissa/banking-backend:latest
    container_name: primary_backend
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: banking
      DB_USER: postgres
      DB_PASS: dbprimarybanking
      REDIS_HOST: redis
      NODE_ROLE: PRIMARY-EC2-1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: abdueissa/banking-frontend:latest
    container_name: primary_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pg_primary_data:
