services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: witness_etcd
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_witness_v2:/etcd-data
    environment:
      ETCD_NAME: "etcd-witness"
      ETCD_DATA_DIR: "/etcd-data"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_ADVERTISE_CLIENT_URLS: "http://172.31.43.188:2379"
      ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:2380"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://172.31.43.188:2380"
      ETCD_INITIAL_CLUSTER: "etcd-primary=http://172.31.38.111:2380,etcd-standby=http://172.31.38.189:2380,etcd-witness=http://172.31.43.188:2380"
      ETCD_INITIAL_CLUSTER_STATE: "new"
      ETCD_INITIAL_CLUSTER_TOKEN: "banking-ha-cluster"

volumes:
  etcd_witness_v2:
